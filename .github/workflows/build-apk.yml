name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      # APK 檔名含版本：InvCalculator-v<versionName>-build<編號>.apk
      - name: Name APK with version
        id: ver
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          FILE="InvCalculator-v${VN}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: InvCalculator-debug-apk
          path: ${{ steps.ver.outputs.file }}
      # 只有 main 分支才發佈到 GitHub Releases，方便直接下載 APK
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          name: 投資計算機 v${{ steps.ver.outputs.name }}（build ${{ github.run_number }}）
          files: ${{ steps.ver.outputs.file }}
